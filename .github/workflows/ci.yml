# 只跑不接触真 NAS 的测试。不登录极空间，不读取浏览器会话，不部署。
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base
        run: git fetch origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Test
        env:
          ROGMEM_EMBED: "off"
          ROGMEM_PROMPTS_BASE: origin/main
        run: |
          args=()
          while IFS= read -r node; do
            case "$node" in
              ""|"#"*) continue ;;
            esac
            args+=(--deselect "$node")
          done < tests/ci_known_red.txt
          python -m pytest -q -m "not true_live and not live_resim" "${args[@]}"
